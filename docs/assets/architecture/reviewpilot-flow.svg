<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
  <title id="title">ReviewPilot pull-request review flow</title><desc id="desc">A pull request moves through GitHub data collection, temporary repository inspection, AI analysis, deterministic verification, and one updated PR comment.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".1"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.t{font:700 36px Arial,sans-serif;fill:#0f172a}.h{font:700 23px Arial,sans-serif;fill:#0f172a}.p{font:500 18px Arial,sans-serif;fill:#475569}.b{stroke-width:3;filter:url(#s)}.l{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="1050" rx="28" fill="#f8fafc"/><text x="700" y="62" text-anchor="middle" class="t">How ReviewPilot Reviews a Pull Request</text>
  <rect class="b" x="390" y="105" width="620" height="90" rx="16" fill="#dbeafe" stroke="#3b82f6"/><text x="700" y="145" text-anchor="middle" class="h">1. A developer opens or updates a PR</text><text x="700" y="174" text-anchor="middle" class="p">GitHub starts the ReviewPilot workflow</text><path class="l" d="M700 195V238"/>
  <rect class="b" x="390" y="238" width="620" height="105" rx="16" fill="#e0e7ff" stroke="#6366f1"/><text x="700" y="280" text-anchor="middle" class="h">2. ReviewPilot downloads the PR details</text><text x="700" y="312" text-anchor="middle" class="p">PR description - changed files - full diff - linked issue</text><path class="l" d="M700 343V386"/>
  <rect class="b" x="390" y="386" width="620" height="105" rx="16" fill="#e0f2fe" stroke="#0ea5e9"/><text x="700" y="428" text-anchor="middle" class="h">3. It inspects the exact PR commit</text><text x="700" y="460" text-anchor="middle" class="p">Temporary copy - related code - tests - project rules</text><path class="l" d="M700 491V534"/>
  <rect x="265" y="534" width="870" height="300" rx="24" fill="#faf5ff" stroke="#c084fc" stroke-width="3" stroke-dasharray="10 8"/><text x="305" y="578" class="h" fill="#7e22ce">AI is kept inside a safe boundary</text>
  <rect class="b" x="355" y="610" width="690" height="82" rx="15" fill="#f3e8ff" stroke="#a855f7"/><text x="700" y="646" text-anchor="middle" class="h">4. ReviewPilot removes secrets and limits the text</text><text x="700" y="674" text-anchor="middle" class="p">The AI receives text only - no GitHub token or tools</text><path class="l" d="M700 692V725"/>
  <rect class="b" x="355" y="725" width="690" height="82" rx="15" fill="#f3e8ff" stroke="#a855f7"/><text x="700" y="761" text-anchor="middle" class="h">5. The AI checks the code and requirements</text><text x="700" y="789" text-anchor="middle" class="p">It returns possible problems with confidence scores</text><path class="l" d="M700 834V872"/>
  <rect class="b" x="390" y="872" width="620" height="90" rx="16" fill="#fff7ed" stroke="#f97316"/><text x="700" y="910" text-anchor="middle" class="h">6. ReviewPilot verifies every problem</text><text x="700" y="939" text-anchor="middle" class="p">Correct file - added line - high confidence - no duplicate</text><path class="l" d="M700 962V992"/>
  <rect class="b" x="390" y="992" width="620" height="48" rx="15" fill="#dcfce7" stroke="#22c55e"/><text x="700" y="1024" text-anchor="middle" class="h">7. One PR comment is created or updated</text>
</svg>
