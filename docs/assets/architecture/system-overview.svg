<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">ReviewPilot and IssuePilot system overview</title>
  <desc id="desc">Two GitHub Actions flows share GitHub API and AI provider services. ReviewPilot reviews pull requests, while IssuePilot creates dependency-ready issues.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#0f172a}.subtitle{font:400 20px Inter,Arial,sans-serif;fill:#64748b}.head{font:700 25px Inter,Arial,sans-serif;fill:#0f172a}.text{font:500 19px Inter,Arial,sans-serif;fill:#334155}.small{font:500 17px Inter,Arial,sans-serif;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.box{stroke-width:3;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="920" rx="28" fill="#f8fafc"/>
  <text x="800" y="66" text-anchor="middle" class="title">ReviewPilot Engineering Workflow</text>
  <text x="800" y="100" text-anchor="middle" class="subtitle">Two GitHub Actions that review code and release project tasks</text>

  <rect x="80" y="150" width="680" height="620" rx="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="120" y="198" class="head" fill="#1d4ed8">ReviewPilot</text>
  <rect class="box" x="150" y="235" width="540" height="82" rx="16" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="420" y="270" text-anchor="middle" class="head">Developer opens or updates a PR</text><text x="420" y="298" text-anchor="middle" class="small">Linking the task issue is optional</text>
  <path class="line" d="M420 317V365"/>
  <rect class="box" x="150" y="365" width="540" height="100" rx="16" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="420" y="405" text-anchor="middle" class="head">ReviewPilot reads the PR changes</text><text x="420" y="438" text-anchor="middle" class="small">Changed files - tests - related code - project rules</text>
  <path class="line" d="M420 465V513"/>
  <rect class="box" x="150" y="513" width="540" height="100" rx="16" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="420" y="553" text-anchor="middle" class="head">AI checks code and requirements</text><text x="420" y="586" text-anchor="middle" class="small">ReviewPilot verifies the file, line, and confidence</text>
  <path class="line" d="M420 613V661"/>
  <rect class="box" x="150" y="661" width="540" height="82" rx="16" fill="#dcfce7" stroke="#22c55e"/>
  <text x="420" y="697" text-anchor="middle" class="head">ReviewPilot posts one PR comment</text><text x="420" y="724" text-anchor="middle" class="small">New commits update the same comment</text>

  <rect x="840" y="150" width="680" height="620" rx="26" fill="#fff7ed" stroke="#fdba74" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="880" y="198" class="head" fill="#c2410c">IssuePilot</text>
  <rect class="box" x="910" y="235" width="540" height="82" rx="16" fill="#ffedd5" stroke="#f97316"/>
  <text x="1180" y="270" text-anchor="middle" class="head">Completed work changes in GitHub</text><text x="1180" y="298" text-anchor="middle" class="small">A PR is merged or a managed issue is closed</text>
  <path class="line" d="M1180 317V365"/>
  <rect class="box" x="910" y="365" width="540" height="100" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1180" y="405" text-anchor="middle" class="head">IssuePilot checks the project plan</text><text x="1180" y="438" text-anchor="middle" class="small">Dependencies - task order - current developer work</text>
  <path class="line" d="M1180 465V513"/>
  <rect class="box" x="910" y="513" width="540" height="100" rx="16" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="1180" y="553" text-anchor="middle" class="head">AI writes only the next ready issue</text><text x="1180" y="586" text-anchor="middle" class="small">It uses the latest project document and template</text>
  <path class="line" d="M1180 613V661"/>
  <rect class="box" x="910" y="661" width="540" height="82" rx="16" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1180" y="697" text-anchor="middle" class="head">IssuePilot creates and assigns the issue</text><text x="1180" y="724" text-anchor="middle" class="small">Blocked work waits and duplicates are prevented</text>

  <rect class="box" x="380" y="825" width="380" height="62" rx="14" fill="#ffffff" stroke="#94a3b8"/><text x="570" y="864" text-anchor="middle" class="text">GitHub stores state and runs actions</text>
  <rect class="box" x="840" y="825" width="380" height="62" rx="14" fill="#ffffff" stroke="#94a3b8"/><text x="1030" y="864" text-anchor="middle" class="text">Gemini or OpenRouter provides AI</text>
  <path d="M420 770C420 810 570 790 570 825" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1180 770C1180 810 1030 790 1030 825" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M760 856H840" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 7"/>
</svg>
