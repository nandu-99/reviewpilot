<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
  <title id="title">IssuePilot dependency-aware task flow</title><desc id="desc">IssuePilot reads an approved plan, checks dependencies and assignee capacity, creates one eligible issue, and treats merged PR, manual completion, and cancellation differently.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".1"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.t{font:700 36px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.p{font:500 18px Arial,sans-serif;fill:#475569}.b{stroke-width:3;filter:url(#s)}.l{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.label{font:700 17px Arial,sans-serif}</style></defs>
  <rect width="1400" height="1020" rx="28" fill="#f8fafc"/><text x="700" y="62" text-anchor="middle" class="t">How IssuePilot Creates the Next Task</text>
  <rect class="b" x="390" y="105" width="620" height="90" rx="16" fill="#dbeafe" stroke="#3b82f6"/><text x="700" y="145" text-anchor="middle" class="h">1. Work status changes in GitHub</text><text x="700" y="174" text-anchor="middle" class="p">A PR is merged - an issue is closed - or the workflow is started</text><path class="l" d="M700 195V238"/>
  <rect class="b" x="390" y="238" width="620" height="100" rx="16" fill="#e0e7ff" stroke="#6366f1"/><text x="700" y="279" text-anchor="middle" class="h">2. IssuePilot reads the approved task plan</text><text x="700" y="310" text-anchor="middle" class="p">It also checks current issues, PRs, and developer workload</text><path class="l" d="M700 338V380"/>
  <rect class="b" x="390" y="380" width="620" height="110" rx="16" fill="#fef3c7" stroke="#f59e0b"/><text x="700" y="420" text-anchor="middle" class="h">3. Is the next task ready?</text><text x="700" y="452" text-anchor="middle" class="p">Dependencies are complete and the developer has no active task</text>
  <path class="l" d="M390 435H220V545"/><text x="248" y="419" class="label" fill="#dc2626">NO</text><rect class="b" x="70" y="545" width="300" height="95" rx="16" fill="#fee2e2" stroke="#ef4444"/><text x="220" y="584" text-anchor="middle" class="h">Leave the task blocked</text><text x="220" y="614" text-anchor="middle" class="p">No issue is created</text>
  <path class="l" d="M700 490V545"/><text x="718" y="525" class="label" fill="#16a34a">YES</text><rect class="b" x="390" y="545" width="620" height="95" rx="16" fill="#f3e8ff" stroke="#a855f7"/><text x="700" y="584" text-anchor="middle" class="h">4. AI writes the next issue description</text><text x="700" y="614" text-anchor="middle" class="p">It uses the current project document and issue template</text><path class="l" d="M700 640V685"/>
  <rect class="b" x="390" y="685" width="620" height="90" rx="16" fill="#dcfce7" stroke="#22c55e"/><text x="700" y="723" text-anchor="middle" class="h">5. IssuePilot creates and assigns one issue</text><text x="700" y="752" text-anchor="middle" class="p">A hidden task ID prevents duplicate issues</text>
  <path class="l" d="M700 775V820"/>
  <rect x="95" y="820" width="1210" height="165" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10 8"/><text x="700" y="856" text-anchor="middle" class="h">6. IssuePilot waits for proof that the task is complete</text>
  <rect class="b" x="135" y="885" width="330" height="70" rx="14" fill="#dcfce7" stroke="#22c55e"/><text x="300" y="914" text-anchor="middle" class="h">Linked PR is merged</text><text x="300" y="940" text-anchor="middle" class="p">Task is complete</text>
  <rect class="b" x="535" y="885" width="330" height="70" rx="14" fill="#dcfce7" stroke="#22c55e"/><text x="700" y="914" text-anchor="middle" class="h">Manual label before close</text><text x="700" y="940" text-anchor="middle" class="p">Task is complete</text>
  <rect class="b" x="935" y="885" width="330" height="70" rx="14" fill="#fee2e2" stroke="#ef4444"/><text x="1100" y="914" text-anchor="middle" class="h">Closed without proof</text><text x="1100" y="940" text-anchor="middle" class="p">Cancelled - next tasks stay blocked</text>
</svg>
